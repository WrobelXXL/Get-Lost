services:
  browser:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - map-data:/data
    environment:
      MAP_DATA_DIR: /data
    ports:
      - "8080:80"
    restart: unless-stopped

  maze-gen:
    build:
      context: .
      dockerfile: app/maze-gen/Dockerfile
    volumes:
      - map-data:/data
    environment:
      MAP_OUTPUT_PATH: /data/map.json
    restart: "no"
    profiles:
      - generate

volumes:
  map-data:
