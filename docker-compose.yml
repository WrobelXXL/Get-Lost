services:
  maze-gen:
    build:
      context: .
      dockerfile: app/maze-gen/Dockerfile
    volumes:
      - map-data:/data
    environment:
      MAP_OUTPUT_PATH: /data/map.json
    restart: "no"

  browser:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      maze-gen:
        condition: service_completed_successfully
    volumes:
      - map-data:/data:ro
    environment:
      MAP_INPUT_PATH: /data/map.json
    ports:
      # links: Port auf dem Host, rechts: Port im Container (fest auf 80).
      # Bei Bedarf links auf einen anderen freien Port aendern.
      - "8080:80"
    restart: unless-stopped

volumes:
  map-data:
