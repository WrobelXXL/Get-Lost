services:
  maze-gen:
    build:
      context: .
      dockerfile: app/maze-gen/Dockerfile
    volumes:
      - map-data:/data
    environment:
      MAP_OUTPUT_PATH: /data/map.json
    restart: "no"

  browser:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      maze-gen:
        condition: service_completed_successfully
    volumes:
      - map-data:/data:ro
    environment:
      MAP_DATA_DIR: /data
    ports:
      - "8686:80"
    restart: unless-stopped

volumes:
  map-data:
