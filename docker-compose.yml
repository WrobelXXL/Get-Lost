services:
  maze-gen:
    build:
      context: .
      dockerfile: app/maze-gen/Dockerfile
    volumes:
      - map-data:/data
    environment:
      # Ohne MAZE_LEVEL werden alle Level aus app/maze-gen/config.yml erzeugt,
      # jedes in eine eigene Datei (map-1.json, map-2.json, ...).
      MAP_OUTPUT_PATH: /data/map.json
    restart: "no"

  browser:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      maze-gen:
        condition: service_completed_successfully
    volumes:
      - map-data:/data:ro
    environment:
      # maze-gen erzeugt eine Datei pro Level (map-1.json, map-2.json, ...)
      # in diesem Ordner. Welches Level angezeigt wird, waehlt man im
      # Browser per "?level=" (z. B. "http://localhost:8080/?level=2"),
      # ohne Angabe ist es Level 1.
      MAP_DATA_DIR: /data
    ports:
      # links: Port auf dem Host, rechts: Port im Container (fest auf 80).
      # Bei Bedarf links auf einen anderen freien Port aendern.
      - "8080:80"
    restart: unless-stopped

volumes:
  map-data:
