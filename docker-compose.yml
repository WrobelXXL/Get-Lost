services:
  browser:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - map-data:/data
    environment:
      MAP_DATA_DIR: /data
      PLAYER_API_URL: "http://localhost:8081"
    ports:
      - "8080:80"
    restart: unless-stopped

  player-api:
    build:
      context: .
      dockerfile: app/maze-gen/Dockerfile
    volumes:
      - map-data:/data
    environment:
      MAP_OUTPUT_PATH: /data/map.json
      PLAYER_API_PORT: "8081"
    ports:
      - "8081:8081"
    entrypoint: ["pwsh", "-NoProfile", "-File", "player-control.ps1"]
    restart: unless-stopped

  maze-gen:
    build:
      context: .
      dockerfile: app/maze-gen/Dockerfile
    volumes:
      - map-data:/data
    environment:
      MAP_OUTPUT_PATH: /data/map.json
    restart: "no"
    profiles:
      - tools

volumes:
  map-data:
